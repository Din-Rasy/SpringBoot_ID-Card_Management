name: Spring Boot CI/CD with Ansible

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    name: Build, Test with SQLite, and Deploy
    runs-on: self-hosted

    env:
      SPRING_PROFILES_ACTIVE: test
      BUILD_LOG: github-actions-build-output.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start build output file
        shell: bash
        run: |
          {
            echo "# GitHub Actions Build Output"
            echo ""
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "Actor: ${{ github.actor }}"
            echo "Started at: $(date)"
            echo ""
          } > "$BUILD_LOG"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify environment
        shell: bash
        run: |
          {
            echo ""
            echo "===== Verify Environment ====="
            echo "Workspace: $GITHUB_WORKSPACE"
            echo "Java version:"
            java -version 2>&1
            echo ""
            echo "Maven version:"
            mvn -version
            echo ""
            echo "Git version:"
            git --version
            echo ""
            echo "Ansible version:"
            ansible --version
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Confirm SQLite test configuration
        shell: bash
        run: |
          {
            echo ""
            echo "===== Confirm SQLite Test Configuration ====="
            echo "File: src/test/resources/application-test.properties"
            cat src/test/resources/application-test.properties
            echo ""
            grep -n "jdbc:sqlite" src/test/resources/application-test.properties
            grep -n "SQLiteDialect" src/test/resources/application-test.properties
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Build with Maven
        shell: bash
        run: |
          {
            echo ""
            echo "===== Build with Maven ====="
            echo "Command: mvn clean package -DskipTests"
            mvn clean package -DskipTests
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Test with SQLite database
        shell: bash
        run: |
          {
            echo ""
            echo "===== Test with SQLite Database ====="
            echo "Command: mvn clean test -Dspring.profiles.active=test"
            mvn clean test -Dspring.profiles.active=test
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Run Ansible playbook deploy
        shell: bash
        run: |
          {
            echo ""
            echo "===== Run Ansible Playbook Deploy ====="
            echo "Command: ansible-playbook -i inventory.ini playbook.yml"
            ansible-playbook -i inventory.ini playbook.yml
          } 2>&1 | tee -a "$BUILD_LOG"

      - name: Upload build output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-build-output
          path: github-actions-build-output.txt
          if-no-files-found: warn

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "GitHub Actions Build Failed: ${{ github.repository }} - ${{ github.sha }}"
          to: "${{ github.event.head_commit.author.email }}, srengty@gmail.com"
          from: ${{ secrets.SMTP_FROM }}
          body: |
            GitHub Actions build failed.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Commit author: ${{ github.event.head_commit.author.name }}
            Commit author email: ${{ github.event.head_commit.author.email }}
            Workflow: ${{ github.workflow }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            CC/Notification target:
            srengty@gmail.com

            Please check the workflow logs and the github-actions-build-output artifact.

            Note:
            If the commit author email is private or unavailable, GitHub may hide it. In that case, srengty@gmail.com is still included in the notification recipients.
