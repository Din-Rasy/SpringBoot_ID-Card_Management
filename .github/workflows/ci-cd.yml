name: Spring Boot CI/CD with Ansible

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    name: Build, Test with SQLite, and Deploy
    runs-on: self-hosted
    
    env:
      SPRING_PROFILES_ACTIVE: test
      BUILD_LOG: github-actions-build-output.txt
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start build output file
        run: |
          "# GitHub Actions Build Output" | Out-File -FilePath $env:BUILD_LOG -Encoding utf8
          "" | Out-File -FilePath $env:BUILD_LOG -Append -Encoding utf8
          "Repository: $env:GITHUB_REPOSITORY" | Out-File -FilePath $env:BUILD_LOG -Append -Encoding utf8
          "Branch: $env:GITHUB_REF_NAME" | Out-File -FilePath $env:BUILD_LOG -Append -Encoding utf8
          "Commit: $env:GITHUB_SHA" | Out-File -FilePath $env:BUILD_LOG -Append -Encoding utf8
          "Actor: $env:GITHUB_ACTOR" | Out-File -FilePath $env:BUILD_LOG -Append -Encoding utf8
          "Started at: $(Get-Date)" | Out-File -FilePath $env:BUILD_LOG -Append -Encoding utf8

      - name: Add tools to PATH
        run: |
          # Add local Maven bin to path
          echo "C:\Users\Rasy\maven\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Add Workspace directory to path so the ansible-playbook.cmd wrapper can be executed
          echo "$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify environment
        run: |
          $ErrorActionPreference = 'Continue'
          
          # Write section header
          Write-Output "===== Verify Environment ====="
          Add-Content -Path $env:BUILD_LOG -Value "===== Verify Environment =====" -Encoding UTF8
          
          Write-Output "Workspace: $env:GITHUB_WORKSPACE"
          Add-Content -Path $env:BUILD_LOG -Value "Workspace: $env:GITHUB_WORKSPACE" -Encoding UTF8
          
          # Java version
          Write-Output "Java version:"
          Add-Content -Path $env:BUILD_LOG -Value "Java version:" -Encoding UTF8
          java -version 2> temp_ver.txt
          Get-Content temp_ver.txt | ForEach-Object {
              Write-Output $_
              Add-Content -Path $env:BUILD_LOG -Value $_ -Encoding UTF8
          }
          
          # Maven version
          Write-Output "Maven version:"
          Add-Content -Path $env:BUILD_LOG -Value "Maven version:" -Encoding UTF8
          mvn -version 2> temp_ver.txt
          Get-Content temp_ver.txt | ForEach-Object {
              Write-Output $_
              Add-Content -Path $env:BUILD_LOG -Value $_ -Encoding UTF8
          }
          
          # Git version
          Write-Output "Git version:"
          Add-Content -Path $env:BUILD_LOG -Value "Git version:" -Encoding UTF8
          git --version 2> temp_ver.txt
          Get-Content temp_ver.txt | ForEach-Object {
              Write-Output $_
              Add-Content -Path $env:BUILD_LOG -Value $_ -Encoding UTF8
          }
          
          # Ansible version
          Write-Output "Ansible version:"
          Add-Content -Path $env:BUILD_LOG -Value "Ansible version:" -Encoding UTF8
          ansible-playbook --version 2> temp_ver.txt
          Get-Content temp_ver.txt | ForEach-Object {
              Write-Output $_
              Add-Content -Path $env:BUILD_LOG -Value $_ -Encoding UTF8
          }
          
          if (Test-Path temp_ver.txt) { Remove-Item temp_ver.txt }
          
          # Check availability of critical tools
          if (-not (Get-Command mvn -ErrorAction SilentlyContinue)) {
              Write-Error "Maven is not available!"
              exit 1
          }
          if (-not (Get-Command ansible-playbook -ErrorAction SilentlyContinue)) {
              Write-Error "Ansible is not available!"
              exit 1
          }

      - name: Confirm SQLite test configuration
        run: |
          $ErrorActionPreference = 'Continue'
          
          Write-Output "===== Confirm SQLite Test Configuration ====="
          Add-Content -Path $env:BUILD_LOG -Value "===== Confirm SQLite Test Configuration =====" -Encoding UTF8
          
          Write-Output "File: src/test/resources/application-test.properties"
          Add-Content -Path $env:BUILD_LOG -Value "File: src/test/resources/application-test.properties" -Encoding UTF8
          
          Get-Content src/test/resources/application-test.properties | ForEach-Object {
              Write-Output $_
              Add-Content -Path $env:BUILD_LOG -Value $_ -Encoding UTF8
          }
          
          Write-Output "SQLite references:"
          Add-Content -Path $env:BUILD_LOG -Value "SQLite references:" -Encoding UTF8
          
          Select-String -Path src/test/resources/application-test.properties -Pattern "jdbc:sqlite", "SQLiteDialect" | ForEach-Object {
              Write-Output $_.Line
              Add-Content -Path $env:BUILD_LOG -Value $_.Line -Encoding UTF8
          }

      - name: Build with Maven
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output "===== Build with Maven ====="
          Add-Content -Path $env:BUILD_LOG -Value "===== Build with Maven =====" -Encoding UTF8
          Write-Output "Command: mvn clean package -DskipTests"
          Add-Content -Path $env:BUILD_LOG -Value "Command: mvn clean package -DskipTests" -Encoding UTF8
          
          mvn clean package -DskipTests 2>&1 | ForEach-Object {
              $_ | Out-Host
              $_ | Add-Content -Path $env:BUILD_LOG -Encoding UTF8
          }
          
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Maven build failed!"
              exit $LASTEXITCODE
          }

      - name: Test with SQLite database
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output "===== Test with SQLite Database ====="
          Add-Content -Path $env:BUILD_LOG -Value "===== Test with SQLite Database =====" -Encoding UTF8
          Write-Output "Command: mvn clean test -Dspring.profiles.active=test"
          Add-Content -Path $env:BUILD_LOG -Value "Command: mvn clean test -Dspring.profiles.active=test" -Encoding UTF8
          
          mvn clean test "-Dspring.profiles.active=test" 2>&1 | ForEach-Object {
              $_ | Out-Host
              $_ | Add-Content -Path $env:BUILD_LOG -Encoding UTF8
          }
          
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Maven tests failed!"
              exit $LASTEXITCODE
          }

      - name: Run Ansible playbook deploy
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output "===== Run Ansible Playbook Deploy ====="
          Add-Content -Path $env:BUILD_LOG -Value "===== Run Ansible Playbook Deploy =====" -Encoding UTF8
          Write-Output "Command: ansible-playbook -i inventory.ini playbook.yml"
          Add-Content -Path $env:BUILD_LOG -Value "Command: ansible-playbook -i inventory.ini playbook.yml" -Encoding UTF8
          
          ansible-playbook -i inventory.ini playbook.yml 2>&1 | ForEach-Object {
              $_ | Out-Host
              $_ | Add-Content -Path $env:BUILD_LOG -Encoding UTF8
          }
          
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Ansible deployment failed!"
              exit $LASTEXITCODE
          }

      - name: Upload build output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-build-output
          path: github-actions-build-output.txt
          if-no-files-found: warn

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Send failure email
        if: failure() && env.SMTP_FROM != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "GitHub Actions Build Failed: ${{ github.repository }} - ${{ github.sha }}"
          to: ${{ github.event.head_commit.author.email || 'srengty@gmail.com' }}
          cc: srengty@gmail.com
          from: ${{ env.SMTP_FROM }}
          body: |
            GitHub Actions build failed.
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Commit author: ${{ github.event.head_commit.author.name }}
            Commit author email: ${{ github.event.head_commit.author.email }}
            Workflow: ${{ github.workflow }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Notification:
            - Developer who committed the error
            - CC: srengty@gmail.com
            
            Please check the workflow logs and github-actions-build-output artifact.
            
            Note:
            If the commit author email is private or unavailable, GitHub may hide it.

      - name: Email skipped warning
        if: failure() && env.SMTP_FROM == ''
        run: |
          Write-Output "Build failed, but email was not sent because SMTP secrets are not configured."
          Add-Content -Path $env:BUILD_LOG -Value "Build failed, but email was not sent because SMTP secrets are not configured." -Encoding UTF8
          Write-Output "Please add SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, and SMTP_FROM to GitHub Secrets."
          Add-Content -Path $env:BUILD_LOG -Value "Please add SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, and SMTP_FROM to GitHub Secrets." -Encoding UTF8
