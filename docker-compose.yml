version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: Hello@123
      MYSQL_DATABASE: A-DIN_Rasy-db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-app
    ports:
      - "8443:8080"
      - "2222:22"
    depends_on:
      - mysql
    volumes:
      - web-uploads:/app/uploads
    networks:
      - app-network
    restart: always

volumes:
  mysql-data:
  web-uploads:

networks:
  app-network:
    driver: bridge
